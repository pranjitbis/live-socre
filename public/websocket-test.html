<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏏 Live Cricket Scores - WebSocket Test</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
            background: #0a0e27; 
            color: #fff; 
            min-height: 100vh; 
            padding: 20px; 
        }
        .container { max-width: 1400px; margin: 0 auto; }
        
        /* Header */
        .header { 
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); 
            padding: 25px 30px; 
            border-radius: 16px; 
            margin-bottom: 25px; 
            box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3); 
        }
        .header h1 { font-size: 2em; margin-bottom: 5px; }
        .header-sub { opacity: 0.8; font-size: 0.9em; }
        .status-bar { display: flex; align-items: center; gap: 20px; margin-top: 15px; flex-wrap: wrap; }
        .status { 
            display: inline-flex; 
            align-items: center; 
            gap: 8px; 
            padding: 6px 16px; 
            border-radius: 20px; 
            font-size: 0.85em; 
            font-weight: 600; 
        }
        .status.connected { 
            background: rgba(0, 255, 136, 0.2); 
            color: #00ff88; 
            border: 1px solid rgba(0, 255, 136, 0.3); 
        }
        .status.connected::before { 
            content: ''; 
            width: 8px; 
            height: 8px; 
            background: #00ff88; 
            border-radius: 50%; 
            animation: pulse 1.5s infinite; 
        }
        .status.disconnected { 
            background: rgba(255, 68, 68, 0.2); 
            color: #ff4444; 
            border: 1px solid rgba(255, 68, 68, 0.3); 
        }
        .status.disconnected::before { 
            content: ''; 
            width: 8px; 
            height: 8px; 
            background: #ff4444; 
            border-radius: 50%; 
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        
        .stats-grid { display: flex; gap: 15px; flex-wrap: wrap; }
        .stat-box { 
            background: rgba(255,255,255,0.08); 
            padding: 6px 15px; 
            border-radius: 8px; 
            font-size: 0.85em; 
        }
        .stat-box span { opacity: 0.6; }
        .stat-box strong { font-size: 1.1em; margin-left: 5px; }
        
        /* Controls */
        .controls { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 20px; }
        .btn { 
            padding: 8px 20px; 
            border: none; 
            border-radius: 8px; 
            font-weight: 600; 
            cursor: pointer; 
            transition: all 0.3s; 
            font-size: 0.9em; 
        }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(0,0,0,0.3); }
        .btn-primary { background: #667eea; color: #fff; }
        .btn-danger { background: #ff4444; color: #fff; }
        .btn-success { background: #00cc88; color: #fff; }
        .btn-warning { background: #ffaa00; color: #1a1a2e; }
        .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; border: 1px solid rgba(255,255,255,0.2); }
        .btn-info { background: #00b894; color: #fff; }
        
        /* Matches Grid */
        .matches-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fill, minmax(450px, 1fr)); 
            gap: 20px; 
            margin-bottom: 20px; 
        }
        
        /* Match Card */
        .match-card { 
            background: rgba(255,255,255,0.05); 
            border: 1px solid rgba(255,255,255,0.08); 
            border-radius: 12px; 
            padding: 20px; 
            transition: all 0.3s; 
            animation: fadeIn 0.3s ease; 
        }
        .match-card:hover { 
            transform: translateY(-3px); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.3); 
            border-color: rgba(102, 126, 234, 0.3); 
        }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .match-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 12px; 
        }
        .match-series { 
            font-size: 0.75em; 
            opacity: 0.7; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .match-status { 
            padding: 3px 12px; 
            border-radius: 12px; 
            font-size: 0.65em; 
            font-weight: 700; 
            text-transform: uppercase; 
            letter-spacing: 0.5px; 
        }
        .match-status.live { background: #ff4444; animation: pulse 1.5s infinite; }
        .match-status.upcoming { background: #ffaa00; color: #1a1a2e; }
        .match-status.finished { background: #00cc88; color: #1a1a2e; }
        
        /* Teams */
        .teams { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin: 15px 0; 
            padding: 10px 0; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }
        .team { text-align: center; flex: 1; }
        .team-logo { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            background: rgba(255,255,255,0.05); 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            margin: 0 auto 5px; 
            font-size: 1.2em; 
        }
        .team-name { font-size: 0.9em; font-weight: 600; }
        .team-score { font-size: 1.4em; font-weight: 700; margin-top: 3px; }
        .team-overs { font-size: 0.7em; opacity: 0.6; }
        .vs { font-size: 0.7em; opacity: 0.4; padding: 0 10px; font-weight: 700; }
        
        /* Current Batsmen */
        .current-batsmen {
            background: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .current-batsmen-title {
            font-size: 0.7em;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .batsman-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 4px 0;
        }
        .batsman-item .name {
            font-weight: 600;
            font-size: 0.9em;
        }
        .batsman-item .stats {
            font-size: 0.8em;
            opacity: 0.7;
        }
        .batsman-item .striker-badge {
            background: #00cc88;
            color: #1a1a2e;
            padding: 1px 8px;
            border-radius: 10px;
            font-size: 0.6em;
            font-weight: 700;
            margin-left: 8px;
        }
        
        /* Current Bowler */
        .current-bowler {
            background: rgba(255, 68, 68, 0.1);
            border-radius: 8px;
            padding: 10px;
            margin: 10px 0;
        }
        .current-bowler-title {
            font-size: 0.7em;
            opacity: 0.6;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 5px;
        }
        .bowler-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .bowler-item .name {
            font-weight: 600;
            font-size: 0.9em;
        }
        .bowler-item .figures {
            font-size: 0.8em;
            opacity: 0.7;
        }
        
        /* Overs Timeline */
        .overs-timeline {
            margin: 10px 0;
            max-height: 120px;
            overflow-y: auto;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
            padding: 8px;
        }
        .overs-timeline::-webkit-scrollbar { width: 3px; }
        .overs-timeline::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        .overs-timeline::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        
        .over-item {
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 2px 0;
            font-size: 0.75em;
            border-bottom: 1px solid rgba(255,255,255,0.03);
        }
        .over-number {
            font-weight: 700;
            min-width: 35px;
            opacity: 0.6;
        }
        .over-balls {
            display: flex;
            gap: 3px;
            flex-wrap: wrap;
        }
        .over-ball {
            padding: 0 4px;
            border-radius: 3px;
            font-size: 0.85em;
            font-weight: 600;
        }
        .over-ball.wide { background: #ffaa00; color: #1a1a2e; }
        .over-ball.four { background: #00cc88; color: #1a1a2e; }
        .over-ball.six { background: #ff6b6b; color: #1a1a2e; }
        .over-ball.wicket { background: #ff4444; color: #fff; }
        .over-ball.no-ball { background: #667eea; color: #fff; }
        .over-ball.bye { background: #ff9f43; color: #1a1a2e; }
        .over-ball.dot { background: rgba(255,255,255,0.1); color: #666; }
        .over-total {
            margin-left: auto;
            font-weight: 700;
            opacity: 0.6;
            font-size: 0.9em;
        }
        
        /* Prediction */
        .prediction {
            display: flex;
            gap: 20px;
            margin: 10px 0;
            padding: 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 8px;
        }
        .prediction-item {
            flex: 1;
            text-align: center;
        }
        .prediction-item .label {
            font-size: 0.65em;
            opacity: 0.5;
            text-transform: uppercase;
        }
        .prediction-item .value {
            font-size: 1.2em;
            font-weight: 700;
        }
        .prediction-bar {
            height: 4px;
            background: rgba(255,255,255,0.1);
            border-radius: 2px;
            margin-top: 4px;
            overflow: hidden;
        }
        .prediction-bar .fill {
            height: 100%;
            border-radius: 2px;
            transition: width 0.5s;
        }
        .prediction-bar .fill.home { background: #667eea; }
        .prediction-bar .fill.away { background: #ff6b6b; }
        
        /* Toss */
        .toss-info {
            font-size: 0.75em;
            opacity: 0.6;
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(255,255,255,0.03);
            border-radius: 4px;
        }
        
        /* Weather */
        .weather-info {
            display: flex;
            gap: 15px;
            font-size: 0.7em;
            opacity: 0.7;
            margin: 5px 0;
            padding: 5px 10px;
            background: rgba(0,0,0,0.2);
            border-radius: 4px;
        }
        .weather-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }
        
        .match-footer { 
            display: flex; 
            justify-content: space-between; 
            margin-top: 12px; 
            padding-top: 12px; 
            border-top: 1px solid rgba(255,255,255,0.05); 
            font-size: 0.7em; 
            opacity: 0.5; 
        }
        .no-matches { text-align: center; padding: 60px 20px; opacity: 0.5; }
        .no-matches .icon { font-size: 3em; margin-bottom: 15px; }
        
        /* Log */
        .log-container { 
            background: rgba(0,0,0,0.4); 
            border-radius: 12px; 
            padding: 15px; 
            margin-top: 20px; 
        }
        .log-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: center; 
            margin-bottom: 10px; 
        }
        .log-header h3 { font-size: 0.9em; opacity: 0.7; }
        .log-count { font-size: 0.75em; opacity: 0.5; }
        #log { 
            font-family: 'Courier New', monospace; 
            font-size: 0.75em; 
            height: 150px; 
            overflow-y: auto; 
            background: rgba(0,0,0,0.3); 
            padding: 10px; 
            border-radius: 8px; 
            line-height: 1.6; 
            white-space: pre-wrap; 
            word-break: break-all; 
        }
        #log::-webkit-scrollbar { width: 4px; }
        #log::-webkit-scrollbar-track { background: rgba(255,255,255,0.05); }
        #log::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 2px; }
        .log-entry { display: flex; gap: 10px; padding: 2px 0; }
        .log-time { opacity: 0.4; min-width: 70px; }
        .log-message { flex: 1; }
        .log-message.success { color: #00cc88; }
        .log-message.error { color: #ff4444; }
        .log-message.warning { color: #ffaa00; }
        .log-message.info { color: #667eea; }
        
        @media (max-width: 768px) {
            .header h1 { font-size: 1.5em; }
            .matches-grid { grid-template-columns: 1fr; }
            .btn { padding: 6px 14px; font-size: 0.8em; }
            .team-score { font-size: 1.1em; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🏏 Live Cricket Scores</h1>
            <div class="header-sub">WebSocket Real-time Updates</div>
            <div class="status-bar">
                <div class="status disconnected" id="status">Disconnected</div>
                <div class="stats-grid">
                    <div class="stat-box"><span>📊 Matches</span><strong id="matchCount">0</strong></div>
                    <div class="stat-box"><span>🔄 Updates</span><strong id="updateCount">0</strong></div>
                    <div class="stat-box"><span>⏱️ Connected</span><strong id="connectedSince">-</strong></div>
                    <div class="stat-box"><span>👥 Clients</span><strong id="clientCount">0</strong></div>
                </div>
            </div>
        </div>

        <div class="controls">
            <button class="btn btn-primary" onclick="connectWS()">🔌 Connect</button>
            <button class="btn btn-danger" onclick="disconnectWS()">⛔ Disconnect</button>
            <button class="btn btn-success" onclick="getLiveMatches()">📡 Get Matches</button>
            <button class="btn btn-warning" onclick="forceRefresh()">🔄 Force Refresh</button>
            <button class="btn btn-secondary" onclick="clearLog()">🗑️ Clear Log</button>
            <button class="btn btn-secondary" onclick="clearMatches()">🧹 Clear Matches</button>
        </div>

        <div class="matches-grid" id="matches"></div>

        <div class="log-container">
            <div class="log-header">
                <h3>📋 Activity Log</h3>
                <span class="log-count" id="logCount">0 entries</span>
            </div>
            <div id="log"></div>
        </div>
    </div>

    <script>
        let ws = null;
        let updateCount = 0;
        let connectedSince = null;
        let reconnectAttempts = 0;
        const MAX_RECONNECT = 10;
        let logEntries = [];

        function connectWS() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                log('⚠️ Already connected', 'warning');
                return;
            }

            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            const wsUrl = `${protocol}//${window.location.host}/ws`;
            
            log(`🔌 Connecting to ${wsUrl}...`, 'info');
            
            try {
                ws = new WebSocket(wsUrl);

                ws.onopen = () => {
                    log('✅ WebSocket connected!', 'success');
                    document.getElementById('status').className = 'status connected';
                    document.getElementById('status').textContent = '🟢 Connected';
                    connectedSince = new Date();
                    document.getElementById('connectedSince').textContent = connectedSince.toLocaleTimeString();
                    reconnectAttempts = 0;
                    
                    ws.send(JSON.stringify({
                        type: 'subscribe',
                        payload: { topics: ['live'] }
                    }));
                    
                    ws.send(JSON.stringify({
                        type: 'getLiveMatches'
                    }));
                };

                ws.onmessage = (event) => {
                    try {
                        const data = JSON.parse(event.data);
                        handleWebSocketMessage(data);
                    } catch (error) {
                        log(`❌ Parse error: ${error.message}`, 'error');
                        console.error('Parse error:', error, 'Data:', event.data);
                    }
                };

                ws.onclose = () => {
                    log('❌ WebSocket disconnected', 'error');
                    document.getElementById('status').className = 'status disconnected';
                    document.getElementById('status').textContent = '🔴 Disconnected';
                    
                    if (reconnectAttempts < MAX_RECONNECT) {
                        reconnectAttempts++;
                        const delay = Math.min(3000 * reconnectAttempts, 30000);
                        log(`🔄 Reconnecting in ${delay/1000}s (attempt ${reconnectAttempts}/${MAX_RECONNECT})...`, 'warning');
                        setTimeout(connectWS, delay);
                    } else {
                        log('❌ Max reconnect attempts reached. Please refresh.', 'error');
                    }
                };

                ws.onerror = (error) => {
                    log(`❌ WebSocket error: ${error.message || 'Unknown'}`, 'error');
                };
            } catch (error) {
                log(`❌ Connection failed: ${error.message}`, 'error');
            }
        }

        function disconnectWS() {
            if (ws) {
                ws.close();
                ws = null;
                log('🔌 Disconnected manually', 'info');
                reconnectAttempts = MAX_RECONNECT;
            } else {
                log('⚠️ Not connected', 'warning');
            }
        }

        function handleWebSocketMessage(data) {
            const { type, data: payload } = data;
            
            switch(type) {
                case 'connection':
                    log(`✅ ${payload.message} (ID: ${payload.clientId})`, 'success');
                    document.getElementById('clientCount').textContent = payload.totalClients || 0;
                    break;
                    
                case 'live:update':
                    const matches = Array.isArray(payload.matches) ? payload.matches : [];
                    updateCount++;
                    document.getElementById('updateCount').textContent = updateCount;
                    displayMatches(matches);
                    document.getElementById('matchCount').textContent = matches.length;
                    log(`📊 Updated ${matches.length} matches`, 'info');
                    break;
                    
                case 'subscribed':
                    log(`📡 Subscribed to: ${payload.topics.join(', ')}`, 'info');
                    break;
                    
                case 'pong':
                    log('🏓 Pong received', 'info');
                    break;
                    
                case 'scrape:start':
                    log(`🔄 ${payload.message}`, 'info');
                    break;
                    
                case 'scrape:complete':
                    const scrapeMatches = Array.isArray(payload.matches) ? payload.matches : [];
                    log(`✅ Scrape complete: ${scrapeMatches.length} matches`, 'success');
                    break;
                    
                case 'scrape:error':
                    log(`❌ Scrape error: ${payload.error}`, 'error');
                    break;
                    
                case 'error':
                    log(`❌ ${payload.message || payload.error || 'Unknown error'}`, 'error');
                    break;
                    
                default:
                    log(`⚠️ Unknown message type: ${type}`, 'warning');
                    console.log('Unknown message:', data);
            }
        }

        function getBallClass(ball) {
            const b = ball.toLowerCase();
            if (b.includes('wd') || b.includes('wide')) return 'wide';
            if (b.includes('4') || b.includes('four')) return 'four';
            if (b.includes('6') || b.includes('six')) return 'six';
            if (b.includes('w') || b.includes('wicket') || b.includes('out')) return 'wicket';
            if (b.includes('nb') || b.includes('no ball')) return 'no-ball';
            if (b.includes('bye')) return 'bye';
            if (b.includes('0') || b.includes('dot')) return 'dot';
            return '';
        }

        function displayMatches(matches) {
            const container = document.getElementById('matches');
            
            if (!Array.isArray(matches) || matches.length === 0) {
                container.innerHTML = `
                    <div class="no-matches">
                        <div class="icon">🏏</div>
                        <div>No live matches currently in progress</div>
                        <div style="font-size:0.8em;opacity:0.5;margin-top:10px;">
                            ${ws && ws.readyState === WebSocket.OPEN ? '🟢 Connected' : '🔴 Disconnected'}
                        </div>
                    </div>
                `;
                return;
            }

            container.innerHTML = matches.map((match) => {
                const team1Name = match.teams?.home?.name || match.team1?.name || 'Team 1';
                const team2Name = match.teams?.away?.name || match.team2?.name || 'Team 2';
                const team1Score = match.scoreboard?.batting_team?.score || match.team1?.score || '0';
                const team2Score = match.scoreboard?.bowling_team?.score || match.team2?.score || '0';
                const team1Overs = match.scoreboard?.batting_team?.overs || match.team1?.overs || '';
                const team2Overs = match.scoreboard?.bowling_team?.overs || match.team2?.overs || '';
                const status = match.match?.status || match.status || 'LIVE';
                const statusClass = status.toLowerCase();
                const seriesName = match.series?.name || match.series || 'Match';
                const venue = match.venue?.name || match.venue || 'TBD';
                const timestamp = match.timestamp || match.match?.start_time || new Date().toISOString();
                
                // Current Batsmen
                const batsmen = match.current_batsmen || [];
                const batsmenHtml = batsmen.length > 0 ? `
                    <div class="current-batsmen">
                        <div class="current-batsmen-title">🏏 Current Batsmen</div>
                        ${batsmen.map(b => `
                            <div class="batsman-item">
                                <div>
                                    <span class="name">${b.name}</span>
                                    ${b.is_striker ? '<span class="striker-badge">STRIKER</span>' : ''}
                                </div>
                                <div class="stats">
                                    ${b.runs || 0} runs • ${b.balls || 0} balls
                                    ${b.fours ? ` • 4s: ${b.fours}` : ''}
                                    ${b.sixes ? ` • 6s: ${b.sixes}` : ''}
                                    ${b.strike_rate ? ` • SR: ${b.strike_rate}` : ''}
                                </div>
                            </div>
                        `).join('')}
                    </div>
                ` : '';

                // Current Bowler
                const bowler = match.current_bowler || {};
                const bowlerHtml = bowler.name ? `
                    <div class="current-bowler">
                        <div class="current-bowler-title">🎯 Current Bowler</div>
                        <div class="bowler-item">
                            <span class="name">${bowler.name}</span>
                            <span class="figures">
                                ${bowler.overs || '0.0'} overs • 
                                ${bowler.runs || 0} runs • 
                                ${bowler.wickets || 0} wickets
                                ${bowler.economy ? ` • Econ: ${bowler.economy}` : ''}
                            </span>
                        </div>
                    </div>
                ` : '';

                // Overs Timeline
                const overs = match.overs || [];
                const oversHtml = overs.length > 0 ? `
                    <div class="overs-timeline">
                        ${overs.map(o => `
                            <div class="over-item">
                                <span class="over-number">Over ${o.over}</span>
                                <div class="over-balls">
                                    ${(o.balls || []).map(b => `
                                        <span class="over-ball ${getBallClass(b)}">${b}</span>
                                    `).join('')}
                                </div>
                                <span class="over-total">${o.total || ''}</span>
                            </div>
                        `).join('')}
                    </div>
                ` : '';

                // Prediction
                const pred = match.prediction || {};
                const predHtml = (pred.home_probability || pred.away_probability) ? `
                    <div class="prediction">
                        <div class="prediction-item">
                            <div class="label">${team1Name}</div>
                            <div class="value">${pred.home_probability || 0}%</div>
                            <div class="prediction-bar">
                                <div class="fill home" style="width:${pred.home_probability || 0}%"></div>
                            </div>
                        </div>
                        <div class="prediction-item">
                            <div class="label">${team2Name}</div>
                            <div class="value">${pred.away_probability || 0}%</div>
                            <div class="prediction-bar">
                                <div class="fill away" style="width:${pred.away_probability || 0}%"></div>
                            </div>
                        </div>
                    </div>
                ` : '';

                // Toss
                const toss = match.toss || {};
                const tossHtml = toss.status && toss.status !== 'Not Started' ? `
                    <div class="toss-info">🪙 ${toss.status}</div>
                ` : '';

                // Weather
                const weather = match.weather || {};
                const weatherHtml = weather.temperature ? `
                    <div class="weather-info">
                        <span class="weather-item">🌡️ ${weather.temperature}°C</span>
                        ${weather.feels_like ? `<span class="weather-item">🌡️ Feels: ${weather.feels_like}°C</span>` : ''}
                        ${weather.humidity ? `<span class="weather-item">💧 ${weather.humidity}%</span>` : ''}
                        ${weather.wind_speed ? `<span class="weather-item">💨 ${weather.wind_speed} km/h</span>` : ''}
                        ${weather.condition ? `<span class="weather-item">☁️ ${weather.condition}</span>` : ''}
                        ${weather.rain_probability ? `<span class="weather-item">🌧️ ${weather.rain_probability}%</span>` : ''}
                    </div>
                ` : '';

                return `
                    <div class="match-card">
                        <div class="match-header">
                            <span class="match-series">${seriesName}</span>
                            <span class="match-status ${statusClass}">${status}</span>
                        </div>
                        
                        <div class="teams">
                            <div class="team">
                                <div class="team-logo">🏏</div>
                                <div class="team-name">${team1Name}</div>
                                <div class="team-score">${team1Score}</div>
                                <div class="team-overs">${team1Overs}</div>
                            </div>
                            <div class="vs">VS</div>
                            <div class="team">
                                <div class="team-logo">🏏</div>
                                <div class="team-name">${team2Name}</div>
                                <div class="team-score">${team2Score}</div>
                                <div class="team-overs">${team2Overs}</div>
                            </div>
                        </div>
                        
                        ${batsmenHtml}
                        ${bowlerHtml}
                        ${oversHtml}
                        ${predHtml}
                        ${tossHtml}
                        ${weatherHtml}
                        
                        <div class="match-footer">
                            <span>📍 ${venue}</span>
                            <span>🔄 ${new Date(timestamp).toLocaleTimeString()}</span>
                            <span>🆔 ${match.match_id || ''}</span>
                        </div>
                    </div>
                `;
            }).join('');
        }

        function getLiveMatches() {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'getLiveMatches' }));
                log('📤 Requested live matches', 'info');
            } else {
                log('⚠️ WebSocket not connected', 'warning');
            }
        }

        function forceRefresh() {
            log('🔄 Force refreshing...', 'info');
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'forceScrape', payload: { type: 'live' } }));
            } else {
                fetch('/api/scrape/live')
                    .then(res => res.json())
                    .then(data => {
                        if (data.success && data.data) {
                            const matches = Array.isArray(data.data) ? data.data : [];
                            displayMatches(matches);
                            document.getElementById('matchCount').textContent = matches.length;
                            log(`📊 API fallback: ${matches.length} matches`, 'info');
                        }
                    })
                    .catch(err => log(`❌ API error: ${err.message}`, 'error'));
            }
        }

        function clearMatches() {
            displayMatches([]);
            document.getElementById('matchCount').textContent = '0';
            log('🧹 Cleared matches', 'info');
        }

        function log(message, type = 'info') {
            const timestamp = new Date();
            const timeStr = timestamp.toLocaleTimeString();
            
            const entry = { time: timeStr, message, type, timestamp };
            logEntries.push(entry);
            
            if (logEntries.length > 200) {
                logEntries = logEntries.slice(-200);
            }
            
            renderLog();
            document.getElementById('logCount').textContent = `${logEntries.length} entries`;
        }

        function renderLog() {
            const logEl = document.getElementById('log');
            logEl.innerHTML = logEntries.map(entry => `
                <div class="log-entry">
                    <span class="log-time">[${entry.time}]</span>
                    <span class="log-message ${entry.type}">${entry.message}</span>
                </div>
            `).join('');
            logEl.scrollTop = logEl.scrollHeight;
        }

        function clearLog() {
            logEntries = [];
            renderLog();
            document.getElementById('logCount').textContent = '0 entries';
            log('📋 Log cleared', 'info');
        }

        // Auto-connect on page load
        setTimeout(connectWS, 500);

        // Ping every 30 seconds
        setInterval(() => {
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'ping' }));
            }
        }, 30000);

        window.addEventListener('beforeunload', () => {
            if (ws) ws.close();
        });

        console.log('🏏 Cricket Scraper WebSocket Test Client');
        console.log('Commands: connectWS(), disconnectWS(), getLiveMatches(), forceRefresh(), clearLog(), clearMatches()');
    </script>
</body>
</html>
