<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🏏 Live Cricket Scores</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #0a0e27;
        color: #fff;
        min-height: 100vh;
        padding: 20px;
      }
      .container {
        max-width: 1400px;
        margin: 0 auto;
      }

      /* Header */
      .header {
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        padding: 25px 30px;
        border-radius: 16px;
        margin-bottom: 25px;
        box-shadow: 0 10px 40px rgba(102, 126, 234, 0.3);
      }
      .header h1 {
        font-size: 2em;
        margin-bottom: 5px;
      }
      .header-sub {
        opacity: 0.8;
        font-size: 0.9em;
      }
      .status-bar {
        display: flex;
        align-items: center;
        gap: 20px;
        margin-top: 15px;
        flex-wrap: wrap;
      }
      .status {
        display: inline-flex;
        align-items: center;
        gap: 8px;
        padding: 6px 16px;
        border-radius: 20px;
        font-size: 0.85em;
        font-weight: 600;
      }
      .status.connected {
        background: rgba(0, 255, 136, 0.2);
        color: #00ff88;
        border: 1px solid rgba(0, 255, 136, 0.3);
      }
      .status.connected::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #00ff88;
        border-radius: 50%;
        animation: pulse 1.5s infinite;
      }
      .status.disconnected {
        background: rgba(255, 68, 68, 0.2);
        color: #ff4444;
        border: 1px solid rgba(255, 68, 68, 0.3);
      }
      .status.disconnected::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #ff4444;
        border-radius: 50%;
      }
      .status.connecting {
        background: rgba(255, 170, 0, 0.2);
        color: #ffaa00;
        border: 1px solid rgba(255, 170, 0, 0.3);
      }
      .status.connecting::before {
        content: '';
        width: 8px;
        height: 8px;
        background: #ffaa00;
        border-radius: 50%;
        animation: pulse 0.8s infinite;
      }
      @keyframes pulse {
        0%,
        100% {
          opacity: 1;
        }
        50% {
          opacity: 0.3;
        }
      }

      .stats-grid {
        display: flex;
        gap: 15px;
        flex-wrap: wrap;
      }
      .stat-box {
        background: rgba(255, 255, 255, 0.08);
        padding: 6px 15px;
        border-radius: 8px;
        font-size: 0.85em;
      }
      .stat-box span {
        opacity: 0.6;
      }
      .stat-box strong {
        font-size: 1.1em;
        margin-left: 5px;
      }

      /* Controls */
      .controls {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        margin-bottom: 20px;
      }
      .btn {
        padding: 8px 20px;
        border: none;
        border-radius: 8px;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        font-size: 0.9em;
      }
      .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      }
      .btn:active {
        transform: translateY(0);
      }
      .btn-primary {
        background: #667eea;
        color: #fff;
      }
      .btn-danger {
        background: #ff4444;
        color: #fff;
      }
      .btn-success {
        background: #00cc88;
        color: #fff;
      }
      .btn-warning {
        background: #ffaa00;
        color: #1a1a2e;
      }
      .btn-info {
        background: #00b894;
        color: #fff;
      }
      .btn-secondary {
        background: rgba(255, 255, 255, 0.1);
        color: #fff;
        border: 1px solid rgba(255, 255, 255, 0.2);
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
        transform: none !important;
      }

      /* Tabs */
      .tabs {
        display: flex;
        gap: 10px;
        margin-bottom: 20px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        padding-bottom: 10px;
        flex-wrap: wrap;
      }
      .tab-btn {
        padding: 10px 25px;
        background: transparent;
        border: none;
        color: rgba(255, 255, 255, 0.5);
        font-size: 1em;
        font-weight: 600;
        cursor: pointer;
        transition: all 0.3s;
        border-radius: 8px;
      }
      .tab-btn:hover {
        color: #fff;
        background: rgba(255, 255, 255, 0.05);
      }
      .tab-btn.active {
        color: #fff;
        background: rgba(102, 126, 234, 0.3);
      }

      .tab-content {
        display: none;
      }
      .tab-content.active {
        display: block;
        animation: fadeIn 0.3s ease;
      }

      /* Matches Grid */
      .matches-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(450px, 1fr));
        gap: 20px;
        margin-bottom: 20px;
      }

      /* Match Card */
      .match-card {
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 12px;
        padding: 20px;
        transition: all 0.3s;
        animation: fadeIn 0.3s ease;
      }
      .match-card:hover {
        transform: translateY(-3px);
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        border-color: rgba(102, 126, 234, 0.3);
      }
      @keyframes fadeIn {
        from {
          opacity: 0;
          transform: translateY(10px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }

      .match-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 12px;
        flex-wrap: wrap;
        gap: 8px;
      }
      .match-series {
        font-size: 0.75em;
        opacity: 0.7;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .match-status {
        padding: 3px 12px;
        border-radius: 12px;
        font-size: 0.65em;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.5px;
      }
      .match-status.live {
        background: #ff4444;
        animation: pulse 1.5s infinite;
      }
      .match-status.upcoming {
        background: #ffaa00;
        color: #1a1a2e;
      }
      .match-status.finished {
        background: #00cc88;
        color: #1a1a2e;
      }
      .match-status.rain {
        background: #667eea;
        color: #fff;
      }

      /* Teams */
      .teams {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 15px 0;
        padding: 10px 0;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .team {
        text-align: center;
        flex: 1;
      }
      .team-logo {
        width: 40px;
        height: 40px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 5px;
        font-size: 1.2em;
      }
      .team-logo img {
        width: 32px;
        height: 32px;
        border-radius: 50%;
        object-fit: contain;
      }
      .team-name {
        font-size: 0.9em;
        font-weight: 600;
      }
      .team-score {
        font-size: 1.4em;
        font-weight: 700;
        margin-top: 3px;
      }
      .team-score .wickets {
        font-size: 0.6em;
        opacity: 0.6;
        font-weight: 400;
      }
      .team-overs {
        font-size: 0.7em;
        opacity: 0.6;
      }
      .vs {
        font-size: 0.7em;
        opacity: 0.4;
        padding: 0 10px;
        font-weight: 700;
      }

      /* Current Batsmen */
      .current-batsmen {
        background: rgba(102, 126, 234, 0.1);
        border-radius: 8px;
        padding: 10px;
        margin: 10px 0;
      }
      .current-batsmen-title {
        font-size: 0.7em;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }
      .batsman-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 4px 0;
      }
      .batsman-item .name {
        font-weight: 600;
        font-size: 0.9em;
      }
      .batsman-item .stats {
        font-size: 0.8em;
        opacity: 0.7;
      }
      .batsman-item .striker-badge {
        background: #00cc88;
        color: #1a1a2e;
        padding: 1px 8px;
        border-radius: 10px;
        font-size: 0.6em;
        font-weight: 700;
        margin-left: 8px;
      }

      /* Current Bowler */
      .current-bowler {
        background: rgba(255, 68, 68, 0.1);
        border-radius: 8px;
        padding: 10px;
        margin: 10px 0;
      }
      .current-bowler-title {
        font-size: 0.7em;
        opacity: 0.6;
        text-transform: uppercase;
        letter-spacing: 0.5px;
        margin-bottom: 5px;
      }
      .bowler-item {
        display: flex;
        align-items: center;
        justify-content: space-between;
      }
      .bowler-item .name {
        font-weight: 600;
        font-size: 0.9em;
      }
      .bowler-item .figures {
        font-size: 0.8em;
        opacity: 0.7;
      }

      /* Overs Timeline */
      .overs-timeline {
        margin: 10px 0;
        max-height: 120px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
        padding: 8px;
      }
      .overs-timeline::-webkit-scrollbar {
        width: 3px;
      }
      .overs-timeline::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .overs-timeline::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }

      .over-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 2px 0;
        font-size: 0.75em;
        border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      }
      .over-number {
        font-weight: 700;
        min-width: 35px;
        opacity: 0.6;
        font-size: 0.8em;
      }
      .over-balls {
        display: flex;
        gap: 3px;
        flex-wrap: wrap;
      }
      .over-ball {
        padding: 0 4px;
        border-radius: 3px;
        font-size: 0.85em;
        font-weight: 600;
        min-width: 18px;
        text-align: center;
      }
      .over-ball.wide {
        background: #ffaa00;
        color: #1a1a2e;
      }
      .over-ball.four {
        background: #00cc88;
        color: #1a1a2e;
      }
      .over-ball.six {
        background: #ff6b6b;
        color: #1a1a2e;
      }
      .over-ball.wicket {
        background: #ff4444;
        color: #fff;
      }
      .over-ball.no-ball {
        background: #667eea;
        color: #fff;
      }
      .over-ball.bye {
        background: #ff9f43;
        color: #1a1a2e;
      }
      .over-ball.dot {
        background: rgba(255, 255, 255, 0.1);
        color: #666;
      }
      .over-total {
        margin-left: auto;
        font-weight: 700;
        opacity: 0.6;
        font-size: 0.9em;
      }

      /* Prediction */
      .prediction {
        display: flex;
        gap: 20px;
        margin: 10px 0;
        padding: 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 8px;
      }
      .prediction-item {
        flex: 1;
        text-align: center;
      }
      .prediction-item .label {
        font-size: 0.65em;
        opacity: 0.5;
        text-transform: uppercase;
      }
      .prediction-item .value {
        font-size: 1.2em;
        font-weight: 700;
      }
      .prediction-bar {
        height: 4px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
        margin-top: 4px;
        overflow: hidden;
      }
      .prediction-bar .fill {
        height: 100%;
        border-radius: 2px;
        transition: width 0.5s;
      }
      .prediction-bar .fill.home {
        background: #667eea;
      }
      .prediction-bar .fill.away {
        background: #ff6b6b;
      }

      /* Toss */
      .toss-info {
        font-size: 0.75em;
        opacity: 0.7;
        margin: 5px 0;
        padding: 5px 10px;
        background: rgba(255, 255, 255, 0.03);
        border-radius: 4px;
        border-left: 3px solid #667eea;
      }
      .toss-info .winner {
        color: #00cc88;
        font-weight: 600;
      }
      .toss-info .decision {
        color: #ffaa00;
        font-weight: 600;
      }

      /* Weather */
      .weather-info {
        display: flex;
        gap: 15px;
        font-size: 0.7em;
        opacity: 0.7;
        margin: 5px 0;
        padding: 5px 10px;
        background: rgba(0, 0, 0, 0.2);
        border-radius: 4px;
        flex-wrap: wrap;
      }
      .weather-item {
        display: flex;
        align-items: center;
        gap: 4px;
      }

      .match-footer {
        display: flex;
        justify-content: space-between;
        margin-top: 12px;
        padding-top: 12px;
        border-top: 1px solid rgba(255, 255, 255, 0.05);
        font-size: 0.7em;
        opacity: 0.5;
        flex-wrap: wrap;
        gap: 5px;
      }

      /* Score Update Flash */
      .score-flash {
        animation: scoreFlash 0.5s ease;
      }
      @keyframes scoreFlash {
        0% {
          color: #ffaa00;
          transform: scale(1.2);
        }
        100% {
          color: #fff;
          transform: scale(1);
        }
      }

      .no-matches {
        text-align: center;
        padding: 60px 20px;
        opacity: 0.5;
      }
      .no-matches .icon {
        font-size: 3em;
        margin-bottom: 15px;
      }
      .no-matches .sub-text {
        font-size: 0.8em;
        opacity: 0.7;
        margin-top: 10px;
      }

      /* Team Form Section */
      .team-form-section {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 16px;
        padding: 20px;
        margin-bottom: 25px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .team-form-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-bottom: 20px;
        flex-wrap: wrap;
        gap: 10px;
      }
      .team-form-title {
        font-size: 1.2em;
        font-weight: 700;
        color: #fff;
      }
      .team-form-title span {
        opacity: 0.6;
        font-size: 0.8em;
        font-weight: 400;
      }
      .team-form-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
      }
      @media (max-width: 768px) {
        .team-form-grid {
          grid-template-columns: 1fr;
        }
      }

      .team-form-card {
        background: rgba(255, 255, 255, 0.03);
        border-radius: 12px;
        padding: 15px;
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      .team-form-card .team-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
        padding-bottom: 10px;
        border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      }
      .team-form-card .team-header img {
        width: 36px;
        height: 36px;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.05);
        object-fit: contain;
        padding: 4px;
      }
      .team-form-card .team-header .team-full-name {
        font-weight: 600;
        font-size: 0.95em;
      }
      .team-form-card .team-header .team-short-name {
        opacity: 0.5;
        font-size: 0.8em;
      }

      .form-results {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }
      .form-result {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 0.7em;
        font-weight: 700;
        transition: all 0.3s;
      }
      .form-result.win {
        background: #00cc88;
        color: #1a1a2e;
      }
      .form-result.loss {
        background: #ff4444;
        color: #fff;
      }
      .form-result.draw {
        background: #ffaa00;
        color: #1a1a2e;
      }
      .form-result.upcoming {
        background: rgba(255, 255, 255, 0.1);
        color: rgba(255, 255, 255, 0.3);
      }
      .form-result.current {
        border: 2px solid #667eea;
        box-shadow: 0 0 15px rgba(102, 126, 234, 0.3);
      }

      .match-history {
        max-height: 200px;
        overflow-y: auto;
      }
      .match-history::-webkit-scrollbar {
        width: 3px;
      }
      .match-history::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      .match-history::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }

      .match-history-item {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 6px 8px;
        border-radius: 6px;
        transition: all 0.3s;
        cursor: pointer;
        text-decoration: none;
        color: #fff;
      }
      .match-history-item:hover {
        background: rgba(255, 255, 255, 0.05);
      }
      .match-history-item .h-team {
        display: flex;
        align-items: center;
        gap: 6px;
        flex: 1;
      }
      .match-history-item .h-team img {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        object-fit: contain;
        background: rgba(255, 255, 255, 0.05);
        padding: 2px;
      }
      .match-history-item .h-team .h-name {
        font-size: 0.8em;
      }
      .match-history-item .h-score {
        font-size: 0.8em;
        font-weight: 600;
        min-width: 45px;
        text-align: right;
      }
      .match-history-item .h-vs {
        opacity: 0.3;
        font-size: 0.7em;
        margin: 0 4px;
      }
      .match-history-item .h-result {
        font-size: 0.65em;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 10px;
        min-width: 22px;
        text-align: center;
      }
      .match-history-item .h-result.win {
        background: rgba(0, 204, 136, 0.2);
        color: #00cc88;
      }
      .match-history-item .h-result.loss {
        background: rgba(255, 68, 68, 0.2);
        color: #ff4444;
      }
      .match-history-item .h-result.upcoming {
        background: rgba(255, 255, 255, 0.05);
        color: rgba(255, 255, 255, 0.3);
      }
      .match-history-item .h-match-name {
        font-size: 0.6em;
        opacity: 0.4;
        min-width: 50px;
      }

      /* Log */
      .log-container {
        background: rgba(0, 0, 0, 0.4);
        border-radius: 12px;
        padding: 15px;
        margin-top: 20px;
      }
      .log-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 10px;
      }
      .log-header h3 {
        font-size: 0.9em;
        opacity: 0.7;
      }
      .log-count {
        font-size: 0.75em;
        opacity: 0.5;
      }
      #log {
        font-family: 'Courier New', monospace;
        font-size: 0.75em;
        height: 150px;
        overflow-y: auto;
        background: rgba(0, 0, 0, 0.3);
        padding: 10px;
        border-radius: 8px;
        line-height: 1.6;
        white-space: pre-wrap;
        word-break: break-all;
      }
      #log::-webkit-scrollbar {
        width: 4px;
      }
      #log::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.05);
      }
      #log::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.2);
        border-radius: 2px;
      }
      .log-entry {
        display: flex;
        gap: 10px;
        padding: 2px 0;
      }
      .log-time {
        opacity: 0.4;
        min-width: 70px;
        flex-shrink: 0;
      }
      .log-message {
        flex: 1;
        word-break: break-word;
      }
      .log-message.success {
        color: #00cc88;
      }
      .log-message.error {
        color: #ff4444;
      }
      .log-message.warning {
        color: #ffaa00;
      }
      .log-message.info {
        color: #667eea;
      }
      .log-message.score {
        color: #ffaa00;
        font-weight: 600;
      }
      .log-message.connection {
        color: #00b894;
      }

      /* Responsive */
      @media (max-width: 768px) {
        body {
          padding: 10px;
        }
        .header {
          padding: 15px 20px;
        }
        .header h1 {
          font-size: 1.5em;
        }
        .matches-grid {
          grid-template-columns: 1fr;
        }
        .btn {
          padding: 6px 14px;
          font-size: 0.8em;
        }
        .team-score {
          font-size: 1.1em;
        }
        .team-form-grid {
          grid-template-columns: 1fr;
        }
        .stats-grid {
          gap: 8px;
        }
        .stat-box {
          font-size: 0.75em;
          padding: 4px 10px;
        }
        .status-bar {
          gap: 10px;
        }
        .tabs {
          gap: 5px;
        }
        .tab-btn {
          padding: 8px 15px;
          font-size: 0.85em;
        }
      }

      @media (max-width: 480px) {
        .teams {
          flex-direction: column;
          gap: 10px;
        }
        .vs {
          padding: 5px 0;
        }
        .match-card {
          padding: 15px;
        }
        .controls {

      // ============================================================
      // ⭐ CONNECTION
      // ============================================================

      function connectWS() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          log('⚠️ Already connected', 'warning');
          return;
        }

        if (ws && ws.readyState === WebSocket.CONNECTING) {
          log('⏳ Connection already in progress...', 'warning');
          return;
        }

        log(`🔌 Connecting to ${WS_URL}...`, 'connection');
        updateStatus('connecting');

        try {
          ws = new WebSocket(WS_URL);

          ws.onopen = () => {
            log('✅ WebSocket connected!', 'success');
            updateStatus('connected');
            connectedSince = new Date();
            document.getElementById('connectedSince').textContent =
              connectedSince.toLocaleTimeString();
            reconnectAttempts = 0;

            const protocol = WS_URL.startsWith('wss') ? 'wss' : 'ws';
            document.getElementById('protocolDisplay').textContent = protocol;
            connectionProtocol = protocol;

            // ⭐ Subscribe to channels
            ws.send(
              JSON.stringify({
                type: 'subscribe',
                payload: { topics: ['live', 'score', 'commentary'] },
              })
            );

            // ⭐ Request initial data
            ws.send(
              JSON.stringify({
                type: 'getLiveMatches',
              })
            );

            // ⭐ Auto-refresh every 10 seconds
            if (autoRefreshInterval) clearInterval(autoRefreshInterval);
            autoRefreshInterval = setInterval(() => {
              if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(JSON.stringify({ type: 'getLiveMatches' }));
              }
            }, 10000);

            log('📡 Subscribed to live, score, and commentary updates', 'info');
            getWSInfo();
          };

          ws.onmessage = (event) => {
            try {
              const data = JSON.parse(event.data);
              handleWebSocketMessage(data);
            } catch (error) {
              log(`❌ Parse error: ${error.message}`, 'error');
              console.error('Parse error:', error, 'Data:', event.data);
            }
          };

          ws.onclose = (event) => {
            log(`❌ WebSocket disconnected (code: ${event.code})`, 'error');
            updateStatus('disconnected');

            if (autoRefreshInterval) {
              clearInterval(autoRefreshInterval);
              autoRefreshInterval = null;
            }

            if (reconnectAttempts < MAX_RECONNECT && event.code !== 1000) {
              reconnectAttempts++;
              const delay = Math.min(3000 * reconnectAttempts, 30000);
              log(
                `🔄 Reconnecting in ${delay / 1000}s (attempt ${reconnectAttempts}/${MAX_RECONNECT})...`,
                'warning'
              );
              setTimeout(connectWS, delay);
            } else if (event.code === 1000) {
              log('🔌 Disconnected gracefully', 'info');
            } else {
              log('❌ Max reconnect attempts reached. Please refresh.', 'error');
            }
          };

          ws.onerror = (error) => {
            log(`❌ WebSocket error: ${error.message || 'Unknown'}`, 'error');
          };
        } catch (error) {
          log(`❌ Connection failed: ${error.message}`, 'error');
          updateStatus('disconnected');
        }
      }

      function disconnectWS() {
        if (ws) {
          ws.close(1000, 'Client disconnected');
          ws = null;
          log('🔌 Disconnected manually', 'info');
          updateStatus('disconnected');
          reconnectAttempts = MAX_RECONNECT;
          if (autoRefreshInterval) {
            clearInterval(autoRefreshInterval);
            autoRefreshInterval = null;
          }
        } else {
          log('⚠️ Not connected', 'warning');
        }
      }

      function updateStatus(status) {
        const statusEl = document.getElementById('status');
        statusEl.className = `status ${status}`;

        const statusMap = {
          connected: '🟢 Connected',
          connecting: '🟡 Connecting...',
          disconnected: '🔴 Disconnected',
        };

        statusEl.textContent = statusMap[status] || status;
      }

      // ============================================================
      // ⭐ MESSAGE HANDLER
      // ============================================================

      function handleWebSocketMessage(data) {
        const { type, data: payload } = data;

        switch (type) {
          case 'connection':
            log(`✅ ${payload.message} (ID: ${payload.clientId})`, 'connection');
            if (payload.protocol) {
              document.getElementById('protocolDisplay').textContent = payload.protocol;
              connectionProtocol = payload.protocol;
            }
            break;

          case 'live:update':
            const matches = Array.isArray(payload.matches) ? payload.matches : [];
            updateCount++;
            document.getElementById('updateCount').textContent = updateCount;
            matchCache = matches;
            displayMatches(matches);
            document.getElementById('matchCount').textContent = matches.length;
            log(`📊 Updated ${matches.length} matches`, 'info');
            break;

          case 'score:update':
            const matchId = payload.matchId || 'unknown';
            const scoreData = payload.score || {};

            log(
              `🏏 SCORE: ${scoreData.batting_team?.name || 'Team'} ${scoreData.batting_team?.score || '0'} vs ${scoreData.bowling_team?.name || 'Team'} ${scoreData.bowling_team?.score || '0'}`,
              'score'
            );

            if (matchCache.length > 0 && matchId) {
              matchCache = matchCache.map((match) => {
                const mId = match.match_id || match.matchId || match.id;
                if (mId === matchId) {
                  return {
                    ...match,
                    scoreboard: {
                      ...match.scoreboard,
                      batting_team: {
                        ...match.scoreboard?.batting_team,
                        ...(scoreData.batting_team || {}),
                      },
                      bowling_team: {
                        ...match.scoreboard?.bowling_team,
                        ...(scoreData.bowling_team || {}),
                      },
                      target: scoreData.target || match.scoreboard?.target,
                      required_runs: scoreData.required_runs || match.scoreboard?.required_runs,
                      required_balls: scoreData.required_balls || match.scoreboard?.required_balls,
                      crr: scoreData.crr || match.scoreboard?.crr,
                      rrr: scoreData.rrr || match.scoreboard?.rrr,
                      current_ball: scoreData.current_ball || match.scoreboard?.current_ball,
                    },
                    _lastUpdated: new Date().toISOString(),
                    _updateCount: (match._updateCount || 0) + 1,
                  };
                }
                return match;
              });
              displayMatches(matchCache);
            }

            if (payload.match) {
              const fullMatch = payload.match;
              const mId = fullMatch.match_id || fullMatch.matchId || fullMatch.id;
              if (mId) {
                const existingIndex = matchCache.findIndex(
                  (m) => (m.match_id || m.matchId || m.id) === mId
                );
                if (existingIndex >= 0) {
                  matchCache[existingIndex] = {
                    ...matchCache[existingIndex],
                    ...fullMatch,
                    _lastUpdated: new Date().toISOString(),
                    _updateCount: (matchCache[existingIndex]._updateCount || 0) + 1,
                  };
                } else {
                  matchCache.push(fullMatch);
                }
                displayMatches(matchCache);
                document.getElementById('matchCount').textContent = matchCache.length;
              }
            }

            lastScoreUpdate = new Date();
            document.getElementById('lastScoreTime').textContent =
              lastScoreUpdate.toLocaleTimeString();
            break;

          case 'live:new':
            if (payload.match) {
              matchCache = [payload.match, ...matchCache];
              displayMatches(matchCache);
              document.getElementById('matchCount').textContent = matchCache.length;
              log(
                `🆕 New match: ${payload.match.teams?.home?.name || 'Team'} vs ${payload.match.teams?.away?.name || 'Team'}`,
                'success'
              );
            }
            break;

          case 'live:complete':
            if (payload.match) {
              const mId = payload.match.match_id || payload.match.matchId || payload.match.id;
              matchCache = matchCache.map((m) => {
                if ((m.match_id || m.matchId || m.id) === mId) {
                  return { ...m, ...payload.match, match: { ...m.match, status: 'Finished' } };
                }
                return m;
              });
              displayMatches(matchCache);
              log(`🏁 Match completed`, 'info');
            }
            break;

          case 'subscribed':
            log(`📡 Subscribed to: ${payload.topics.join(', ')}`, 'info');
            break;

          case 'pong':
            break;

          case 'scrape:start':
            isScraping = true;
            log(`🔄 ${payload.message}`, 'info');
            break;

          case 'scrape:complete':
            isScraping = false;
            const scrapeMatches = Array.isArray(payload.matches) ? payload.matches : [];
            if (scrapeMatches.length > 0) {
              matchCache = scrapeMatches;
              displayMatches(scrapeMatches);
              document.getElementById('matchCount').textContent = scrapeMatches.length;
            }
            log(`✅ Scrape complete: ${scrapeMatches.length} matches`, 'success');
            break;

          case 'scrape:error':
            isScraping = false;
            log(`❌ Scrape error: ${payload.error}`, 'error');
            break;

          case 'error':
            log(`❌ ${payload.message || payload.error || 'Unknown error'}`, 'error');
            break;

          default:
            log(`⚠️ Unknown message type: ${type}`, 'warning');
        }
      }

      // ============================================================
      // ⭐ DISPLAY FUNCTIONS
      // ============================================================

      function getBallClass(ball) {
        const b = String(ball).toLowerCase();
        if (b.includes('wd') || b.includes('wide')) return 'wide';
        if (b.includes('4') || b.includes('four')) return 'four';
        if (b.includes('6') || b.includes('six')) return 'six';
        if (b.includes('w') || b.includes('wicket') || b.includes('out')) return 'wicket';
        if (b.includes('nb') || b.includes('no ball')) return 'no-ball';
        if (b.includes('bye')) return 'bye';
        if (b.includes('0') || b.includes('dot')) return 'dot';
        return '';
      }

      function displayMatches(matches) {
        const container = document.getElementById('matches');

        if (!Array.isArray(matches) || matches.length === 0) {
          container.innerHTML = `
            <div class="no-matches">
              <div class="icon">🏏</div>
              <div>No live matches currently in progress</div>
              <div class="sub-text">
                ${ws && ws.readyState === WebSocket.OPEN ? '🟢 Connected' : '🔴 Disconnected'}
                ${connectionProtocol !== 'unknown' ? ` (${connectionProtocol})` : ''}
                ${isScraping ? ' 🔄 Scraping in progress...' : ''}
              </div>
              <div style="margin-top:15px;">
                <button class="btn btn-warning" onclick="forceRefresh()">🔄 Check for matches</button>
              </div>
            </div>
          `;
          return;
        }

        container.innerHTML = matches
          .map((match) => {
            const matchId = match.match_id || match.matchId || match.id || 'unknown';
            const team1Name = match.teams?.home?.name || match.team1?.name || 'Team 1';
            const team2Name = match.teams?.away?.name || match.team2?.name || 'Team 2';
            const team1Score = match.scoreboard?.batting_team?.score || match.team1?.score || '0';
            const team2Score = match.scoreboard?.bowling_team?.score || match.team2?.score || '0';
            const team1Wickets = match.scoreboard?.batting_team?.wickets;
            const team2Wickets = match.scoreboard?.bowling_team?.wickets;
            const team1Overs = match.scoreboard?.batting_team?.overs || match.team1?.overs || '';
            const team2Overs = match.scoreboard?.bowling_team?.overs || match.team2?.overs || '';
            const status = match.match?.status || match.status || 'LIVE';
            const statusClass = status.toLowerCase();
            const seriesName = match.series?.name || match.series || 'Match';
            const venueObj = match.venue;
            const venue = (typeof venueObj === 'object' ? venueObj?.name : venueObj) || 'TBD';
            const timestamp = match._lastUpdated || match.timestamp || new Date().toISOString();
            const updateCount = match._updateCount || 0;
            const scoreFlashClass = updateCount > 1 ? 'score-flash' : '';

            const team1Display =
              team1Wickets !== null && team1Wickets !== undefined
                ? `${team1Score} <span class="wickets">(${team1Wickets})</span>`
                : team1Score;
            const team2Display =
              team2Wickets !== null && team2Wickets !== undefined
                ? `${team2Score} <span class="wickets">(${team2Wickets})</span>`
                : team2Score;

            const pred = match.prediction || {};
            const odds = match.odds || {};
            let oddsHtml = '';
            if (pred.home_probability || pred.away_probability || odds.favorite || odds.betting_summary) {
              const homeP = pred.home_probability || odds.home_win_percentage || 50;
              const awayP = pred.away_probability || odds.away_win_percentage || 50;
              const fav = odds.favorite || (homeP > awayP ? team1Name : team2Name);
              oddsHtml = `
                <div class="prediction">
                  <div class="prediction-item">
                    <div class="label">WIN PROBABILITY / BETTING ODDS</div>
                    <div class="value" style="font-size: 0.9em; margin-top: 4px;">
                      🎯 ${fav ? fav + ' Favored' : 'Equal Odds'} ${odds.market_rates ? `(${odds.market_rates})` : ''}
                    </div>
                    <div class="prediction-bar" style="display:flex; height:6px; margin-top:6px;">
                      <div class="fill home" style="width:${homeP}%; background:#667eea; title:${team1Name} ${homeP}%"></div>
                      <div class="fill away" style="width:${awayP}%; background:#ff6b6b; title:${team2Name} ${awayP}%"></div>
                    </div>
                    <div style="display:flex; justify-content:space-between; font-size:0.7em; margin-top:3px; opacity:0.8;">
                      <span>${team1Name}: ${homeP}%</span>
                      <span>${team2Name}: ${awayP}%</span>
                    </div>
                  </div>
                </div>
              `;
            }

            const yetToBat = match.yet_to_bat || [];
            let ytbHtml = '';
            if (yetToBat.length > 0) {
              ytbHtml = `
                <div style="font-size:0.75em; background:rgba(255,255,255,0.03); padding:8px; border-radius:6px; margin:8px 0; border:1px dashed rgba(255,255,255,0.1);">
                  <div style="opacity:0.6; font-size:0.8em; font-weight:700; margin-bottom:4px;">📋 YET TO BAT</div>
                  <div style="display:flex; gap:6px; flex-wrap:wrap;">
                    ${yetToBat.map(p => `<span style="background:rgba(255,255,255,0.08); padding:2px 8px; border-radius:10px;">${p.name}${p.avg ? ` (Avg ${p.avg})` : ''}</span>`).join('')}
                  </div>
                </div>
              `;
            }

            const batsmen = match.current_batsmen || [];
            const batsmenHtml =
              batsmen.length > 0
                ? `
              <div class="current-batsmen">
                <div class="current-batsmen-title">🏏 Current Batsmen</div>
                ${batsmen
                  .map(
                    (b) => `
                  <div class="batsman-item">
                    <div>
                      <span class="name">${b.name || 'Unknown'}</span>
                      ${b.is_striker ? '<span class="striker-badge">STRIKER</span>' : ''}
                    </div>
                    <div class="stats">
                      ${b.runs || 0} runs • ${b.balls || 0} balls
                    </div>
                  </div>
                `
                  )
                  .join('')}
              </div>
            `
                : '';

            const bowler = match.current_bowler || {};
            const bowlerHtml = bowler.name
              ? `
              <div class="current-bowler">
                <div class="current-bowler-title">🎯 Current Bowler</div>
                <div class="bowler-item">
                  <span class="name">${bowler.name}</span>
                  <span class="figures">
                    ${bowler.overs || '0.0'} overs • ${bowler.runs || 0} runs • ${bowler.wickets || 0} wickets
                  </span>
                </div>
              </div>
            `
              : '';

            const overs = match.overs || [];
            const oversHtml =
              overs.length > 0
                ? `
              <div class="overs-timeline">
                ${overs
                  .map(
                    (o) => `
                  <div class="over-item">
                    <span class="over-number">${o.over ? 'Over ' + o.over : ''}</span>
                    <div class="over-balls">
                      ${(o.balls || [])
                        .map((b) => {
                          const value = typeof b === 'object' ? b.value : b;
                          return `<span class="over-ball ${getBallClass(value)}">${value}</span>`;
                        })
                        .join('')}
                    </div>
                    <span class="over-total">${o.total || ''}</span>
                  </div>
                `
                  )
                  .join('')}
              </div>
            `
                : '';

            const requiredRuns = match.scoreboard?.required_runs || '';
            const requiredBalls = match.scoreboard?.required_balls || '';
            const crr = match.scoreboard?.crr || '';
            const rrr = match.scoreboard?.rrr || '';
            const reqHtml =
              requiredRuns || requiredBalls || crr || rrr
                ? `
              <div style="display:flex;gap:15px;font-size:0.75em;opacity:0.7;margin:5px 0;padding:5px 10px;background:rgba(0,0,0,0.2);border-radius:4px;flex-wrap:wrap;">
                ${requiredRuns ? `<span>🎯 ${requiredRuns}</span>` : ''}
                ${requiredBalls ? `<span>⚾ ${requiredBalls}</span>` : ''}
                ${crr ? `<span>📊 CRR: ${crr}</span>` : ''}
                ${rrr ? `<span>📈 RRR: ${rrr}</span>` : ''}
              </div>
            `
                : '';

            const weather = match.weather || {};
            const weatherHtml = weather.temperature
              ? `
              <div class="weather-info">
                <span class="weather-item">🌡️ ${weather.temperature}°C</span>
                ${weather.condition ? `<span class="weather-item">☁️ ${weather.condition}</span>` : ''}
                ${weather.humidity ? `<span class="weather-item">💧 ${weather.humidity}%</span>` : ''}
                ${weather.wind_speed ? `<span class="weather-item">💨 ${weather.wind_speed} km/h</span>` : ''}
              </div>
            `
              : '';

            const toss = match.toss || {};
            let tossHtml = '';
            if (toss.status && toss.status !== 'unknown' && toss.status !== 'Not Started') {
              tossHtml = `
                <div class="toss-info">
                  🏏 ${toss.status}
                  ${toss.winner ? `<span class="winner">${toss.winner}</span>` : ''}
                  ${toss.decision ? `chose to <span class="decision">${toss.decision}</span>` : ''}
                </div>
              `;
            }

            return `
              <div class="match-card" data-match-id="${matchId}">
                <div class="match-header">
                  <span class="match-series">${seriesName}</span>
                  <span class="match-status ${statusClass}">${status}</span>
                  ${updateCount > 1 ? `<span style="font-size:0.6em;opacity:0.3;">🔄 ${updateCount}</span>` : ''}
                </div>

                <div class="teams">
                  <div class="team">
                    <div class="team-logo">🏏</div>
                    <div class="team-name">${team1Name}</div>
                    <div class="team-score ${scoreFlashClass}">${team1Display}</div>
                    <div class="team-overs">${team1Overs}</div>
                  </div>
                  <div class="vs">VS</div>
                  <div class="team">
                    <div class="team-logo">🏏</div>
                    <div class="team-name">${team2Name}</div>
                    <div class="team-score ${scoreFlashClass}">${team2Display}</div>
                    <div class="team-overs">${team2Overs}</div>
                  </div>
                </div>

                ${reqHtml}
                ${tossHtml}
                ${oddsHtml}
                ${batsmenHtml}
                ${bowlerHtml}
                ${ytbHtml}
                ${oversHtml}
                ${weatherHtml}

                <div class="match-footer">
                  <span>📍 ${venue}</span>
                  <span>🔄 ${new Date(timestamp).toLocaleTimeString()}</span>
                </div>
              </div>
            `;
          })
          .join('');
      }

      // ============================================================
      // ⭐ CONTROL FUNCTIONS
      // ============================================================

      function getLiveMatches() {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'getLiveMatches' }));
          log('📤 Requested live matches', 'info');
        } else {
          log('⚠️ WebSocket not connected', 'warning');
          fetchLiveFromAPI();
        }
      }

      function fetchLiveFromAPI() {
        log('📡 Fetching from API...', 'info');
        fetch(`${API_URL}?force=true`)
          .then((res) => res.json())
          .then((data) => {
            if (data.success && data.data) {
              const matches = Array.isArray(data.data) ? data.data : [];
              matchCache = matches;
              displayMatches(matches);
              document.getElementById('matchCount').textContent = matches.length;
              log(`📊 API: ${matches.length} matches`, 'info');
            } else {
              log(`⚠️ API: ${data.message || 'No data'}`, 'warning');
            }
          })
          .catch((err) => log(`❌ API error: ${err.message}`, 'error'));
      }

      function forceRefresh() {
        log('🔄 Force refreshing...', 'info');
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'forceScrape', payload: { type: 'live' } }));
        } else {
          fetchLiveFromAPI();
        }
      }

      function clearMatches() {
        matchCache = [];
        displayMatches([]);
        document.getElementById('matchCount').textContent = '0';
        log('🧹 Cleared matches', 'info');
      }

      // ============================================================
      // ⭐ WS INFO
      // ============================================================

      function getWSInfo() {
        fetch(WS_INFO_URL)
          .then((res) => res.json())
          .then((data) => {
            if (data.success) {
              displayConnectionInfo(data.websocket);
              log(`ℹ️ WS Info: ${data.websocket.protocol}://${data.websocket.url}`, 'info');
            } else {
              log(`⚠️ Failed to get WS info`, 'warning');
            }
          })
          .catch((err) => log(`❌ WS Info error: ${err.message}`, 'error'));
      }

      function displayConnectionInfo(info) {
        const container = document.getElementById('connectionInfo');
        if (!container) return;

        container.innerHTML = `
          <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:600px;">
            <div><strong>Protocol:</strong></div>
            <div style="color:#00cc88;">${info.protocol || 'unknown'}</div>

            <div><strong>Secure:</strong></div>
            <div>${info.secure ? '✅ Yes' : '❌ No'}</div>

            <div><strong>URL:</strong></div>
            <div style="word-break:break-all;">${info.url || 'N/A'}</div>

            <div><strong>Path:</strong></div>
            <div>${info.path || '/ws'}</div>

            <div><strong>Connected Clients:</strong></div>
            <div>${info.clients || 0}</div>

            <div><strong>Auto-Detect:</strong></div>
            <div>${info.autoDetect ? '✅ Enabled' : '❌ Disabled'}</div>

            <div><strong>Supported Protocols:</strong></div>
            <div>${(info.supportedProtocols || ['ws', 'wss']).join(', ')}</div>
          </div>
          <div style="margin-top:15px;padding:10px;background:rgba(0,0,0,0.2);border-radius:8px;font-size:0.8em;">
            <strong>💡 Connection Help:</strong>
            <pre style="margin-top:5px;font-family:monospace;font-size:0.85em;color:#667eea;">
// Auto-detect WebSocket protocol
const protocol = window.location.protocol === 'https:' ? 'wss' : 'ws';
const wsUrl = \`\${protocol}://\${window.location.host}/ws\`;
const ws = new WebSocket(wsUrl);
            </pre>
          </div>
        `;
      }

      function testConnection() {
        log('🧪 Testing connection...', 'info');
        const protocol = WS_URL.startsWith('wss') ? 'wss' : 'ws';
        log(`📡 Current protocol: ${protocol}`, 'info');

        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping' }));
          log('🏓 Ping sent', 'info');
        } else {
          log('⚠️ Not connected, attempting to connect...', 'warning');
          connectWS();
        }
      }

      // ============================================================
      // ⭐ LOG FUNCTIONS
      // ============================================================

      function log(message, type = 'info') {
        const timestamp = new Date();
        const timeStr = timestamp.toLocaleTimeString();

        const entry = { time: timeStr, message, type, timestamp };
        logEntries.push(entry);

        if (logEntries.length > 200) {
          logEntries = logEntries.slice(-200);
        }

        renderLog();
        document.getElementById('logCount').textContent = `${logEntries.length} entries`;
      }

      function renderLog() {
        const logEl = document.getElementById('log');
        logEl.innerHTML = logEntries
          .map(
            (entry) => `
            <div class="log-entry">
              <span class="log-time">[${entry.time}]</span>
              <span class="log-message ${entry.type}">${entry.message}</span>
            </div>
          `
          )
          .join('');
        logEl.scrollTop = logEl.scrollHeight;
      }

      function clearLog() {
        logEntries = [];
        renderLog();
        document.getElementById('logCount').textContent = '0 entries';
        log('📋 Log cleared', 'info');
      }

      // ============================================================
      // ⭐ AUTO-CONNECT & PING
      // ============================================================

      setTimeout(connectWS, 500);

      setInterval(() => {
        if (ws && ws.readyState === WebSocket.OPEN) {
          ws.send(JSON.stringify({ type: 'ping' }));
        }
      }, 30000);

      window.addEventListener('beforeunload', () => {
        if (ws) ws.close(1000, 'Page unload');
        if (autoRefreshInterval) clearInterval(autoRefreshInterval);
      });

      // ============================================================
      // ⭐ EXPOSE FUNCTIONS TO GLOBAL SCOPE
      // ============================================================

      window.connectWS = connectWS;
      window.disconnectWS = disconnectWS;
      window.getLiveMatches = getLiveMatches;
      window.forceRefresh = forceRefresh;
      window.clearLog = clearLog;
      window.clearMatches = clearMatches;
      window.switchTab = switchTab;
      window.getWSInfo = getWSInfo;
      window.testConnection = testConnection;

      console.log('🏏 Cricket Scraper Dashboard v2.0');
      console.log(`🔌 WebSocket URL: ${WS_URL}`);
      console.log(`🔒 Protocol: ${WS_URL.startsWith('wss') ? 'wss (Secure)' : 'ws (Insecure)'}`);
      console.log('📋 Available Commands:');
      console.log('  connectWS()     - Connect to WebSocket');
      console.log('  disconnectWS()  - Disconnect from WebSocket');
      console.log('  getLiveMatches() - Fetch live matches');
      console.log('  forceRefresh()  - Force refresh matches');
      console.log('  getWSInfo()     - Get WebSocket connection info');
      console.log('  testConnection() - Test WebSocket connection');
      console.log('  clearLog()      - Clear activity log');
      console.log('  clearMatches()  - Clear matches display');
      console.log('  switchTab(tab)  - Switch tabs (live, form, info)');
    </script>
  </body>
</html>
